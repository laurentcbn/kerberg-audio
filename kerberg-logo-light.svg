<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" fill="none">
  <rect width="320" height="380" fill="#F5F3EF"/>
  <!-- Calibration circle -->
  <path d="M 230 140 A 70 70 0 1 1 160 70" stroke="#8A8A8A" stroke-width="1.4" fill="none" opacity="0.5"/>
  <path d="M 160 70 A 70 70 0 0 1 230 140" stroke="#FF6A1A" stroke-width="1.4" fill="none"/>

  <!-- K Monogram Shapes -->
  <rect x="90" y="70" width="49" height="140" fill="#121212"/>
  <polygon points="160,70 230,70 160,140" fill="#FF6A1A"/>
  <polygon points="160,140 230,210 188,210 139,161" fill="#121212"/>

  <!-- Grid lines -->
  <line x1="55" y1="70" x2="265" y2="70" stroke="#8A8A8A" stroke-width="0.8" opacity="0.5"/>
  <line x1="55" y1="210" x2="265" y2="210" stroke="#8A8A8A" stroke-width="0.8" opacity="0.5"/>
  <line x1="90" y1="35" x2="90" y2="245" stroke="#8A8A8A" stroke-width="0.8" opacity="0.5"/>
  <line x1="230" y1="35" x2="230" y2="245" stroke="#8A8A8A" stroke-width="0.8" opacity="0.5"/>
  <line x1="139" y1="35" x2="139" y2="245" stroke="#8A8A8A" stroke-width="0.8" opacity="0.5"/>

  <!-- Crosshairs -->
  <line x1="55" y1="140" x2="160" y2="140" stroke="#8A8A8A" stroke-width="1.4" opacity="0.5"/>
  <line x1="160" y1="140" x2="265" y2="140" stroke="#FF6A1A" stroke-width="1.4"/>
  <line x1="160" y1="35" x2="160" y2="140" stroke="#8A8A8A" stroke-width="1.4" opacity="0.5"/>
  <line x1="160" y1="140" x2="160" y2="245" stroke="#FF6A1A" stroke-width="1.4"/>

  <!-- Typography: K E R B ≡ R G -->
  <g fill="#121212" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="500" text-anchor="middle">
    <text x="46" y="284">K</text>
    <text x="84" y="284">E</text>
    <text x="122" y="284">R</text>
    <text x="160" y="284">B</text>
    
    <!-- ≡ (Three parallel horizontal bars) -->
    <rect x="189" y="269.5" width="18" height="2.4" fill="#121212"/>
    <rect x="189" y="275.8" width="18" height="2.4" fill="#121212"/>
    <rect x="189" y="282.1" width="18" height="2.4" fill="#121212"/>

    <text x="236" y="284">R</text>
    <text x="274" y="284">G</text>
  </g>

  <!-- Subtitle: — A U D I O — -->
  <g fill="#FF6A1A">
    <line x1="45" y1="317" x2="85" y2="317" stroke="#FF6A1A" stroke-width="2"/>
    <text x="160" y="322" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12.5" font-weight="600" letter-spacing="9" text-anchor="middle" fill="#FF6A1A">AUDIO</text>
    <line x1="235" y1="317" x2="275" y2="317" stroke="#FF6A1A" stroke-width="2"/>
  </g>
</svg>