<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 40" width="230" height="40" fill="none">
  <!-- Emblem Squircle (Left) -->
  <rect width="40" height="40" rx="8" fill="#1E1D1B" stroke="#4A463F" stroke-width="1"/>
  <g transform="translate(5, 5) scale(0.1)">
    <!-- Calibration circle -->
    <path d="M 230 150 A 80 80 0 1 1 150 70" stroke="#8A8A8A" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 150 70 A 80 80 0 0 1 230 150" stroke="#FF6A1A" stroke-width="2.5" fill="none"/>
    <!-- K Monogram Shapes -->
    <rect x="70" y="70" width="56" height="160" fill="#E8E0D2"/>
    <polygon points="150,70 230,70 150,150" fill="#FF6A1A"/>
    <polygon points="150,150 230,230 182,230 126,174" fill="#E8E0D2"/>
    <!-- Crosshairs -->
    <line x1="30" y1="150" x2="150" y2="150" stroke="#8A8A8A" stroke-width="2" opacity="0.75"/>
    <line x1="150" y1="150" x2="270" y2="150" stroke="#FF6A1A" stroke-width="2"/>
    <line x1="150" y1="30" x2="150" y2="150" stroke="#8A8A8A" stroke-width="2" opacity="0.75"/>
    <line x1="150" y1="150" x2="150" y2="270" stroke="#FF6A1A" stroke-width="2"/>
  </g>

  <!-- Typography: K E R B ≡ R G -->
  <g fill="#E8E0D2" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">
    <text x="54" y="20">K</text>
    <text x="73.5" y="20">E</text>
    <text x="93" y="20">R</text>
    <text x="112.5" y="20">B</text>
    
    <!-- ≡ (Three parallel horizontal bars) -->
    <rect x="131.5" y="9.2" width="12" height="1.8" fill="#E8E0D2"/>
    <rect x="131.5" y="14.2" width="12" height="1.8" fill="#E8E0D2"/>
    <rect x="131.5" y="19.2" width="12" height="1.8" fill="#E8E0D2"/>

    <text x="151.5" y="20">R</text>
    <text x="171" y="20">G</text>
  </g>

  <!-- Subtitle: — A U D I O — -->
  <g fill="#FF6A1A">
    <line x1="54" y1="32" x2="72" y2="32" stroke="#FF6A1A" stroke-width="1.5"/>
    <text x="118" y="35" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="5.5" text-anchor="middle" fill="#FF6A1A">AUDIO</text>
    <line x1="164" y1="32" x2="182" y2="32" stroke="#FF6A1A" stroke-width="1.5"/>
  </g>
</svg>