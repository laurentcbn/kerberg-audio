<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <!-- Calibration circle: center (150, 150), radius R = 80 -->
  <path d="M 230 150 A 80 80 0 1 1 150 70" stroke="#8A8A8A" stroke-width="1.5" fill="none" opacity="0.75"/>
  <path d="M 150 70 A 80 80 0 0 1 230 150" stroke="#FF6A1A" stroke-width="1.5" fill="none"/>

  <!-- K Monogram Shapes -->
  <rect x="70" y="70" width="56" height="160" fill="#E8E0D2"/>
  <polygon points="150,70 230,70 150,150" fill="#FF6A1A"/>
  <polygon points="150,150 230,230 182,230 126,174" fill="#E8E0D2"/>

  <!-- Construction grid lines -->
  <line x1="30" y1="70" x2="270" y2="70" stroke="#8A8A8A" stroke-width="1" opacity="0.75"/>
  <line x1="30" y1="230" x2="270" y2="230" stroke="#8A8A8A" stroke-width="1" opacity="0.75"/>
  <line x1="70" y1="30" x2="70" y2="270" stroke="#8A8A8A" stroke-width="1" opacity="0.75"/>
  <line x1="230" y1="30" x2="230" y2="270" stroke="#8A8A8A" stroke-width="1" opacity="0.75"/>
  <line x1="126" y1="30" x2="126" y2="270" stroke="#8A8A8A" stroke-width="1" opacity="0.75"/>

  <!-- Crosshairs -->
  <line x1="30" y1="150" x2="150" y2="150" stroke="#8A8A8A" stroke-width="1.5" opacity="0.75"/>
  <line x1="150" y1="150" x2="270" y2="150" stroke="#FF6A1A" stroke-width="1.5"/>
  <line x1="150" y1="30" x2="150" y2="150" stroke="#8A8A8A" stroke-width="1.5" opacity="0.75"/>
  <line x1="150" y1="150" x2="150" y2="270" stroke="#FF6A1A" stroke-width="1.5"/>
</svg>